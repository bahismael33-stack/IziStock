name: Build IziStock

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore IziStock.sln

      - name: Build (Release)
        run: msbuild IziStock.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IziStock-build
          path: |
            IziStock/bin/Release/**
          if-no-files-found: error
